[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campusconnect"
version = "0.1.0"
description = "Student Attendance & Performance Tracker"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
campusconnect = "campusconnect.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
